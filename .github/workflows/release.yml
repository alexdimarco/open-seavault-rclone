name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify before building (gofmt, vet, race suite)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v '^internal/xcrypto/' || true)"
          if [ -n "$unformatted" ]; then echo "not gofmt-clean:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go test -race ./...
      - name: Build per-platform archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            NAME="open-seavault-rclone_${VERSION}_${GOOS}_${GOARCH}"
            BIN="seavault"; [ "$GOOS" = "windows" ] && BIN="seavault.exe"
            mkdir -p "dist/$NAME"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w" -o "dist/$NAME/$BIN" ./cmd/seavault
            cp LICENSE README.md THIRD_PARTY_NOTICES.md TRADEMARKS.md "dist/$NAME/"
            ( cd dist && if [ "$GOOS" = "windows" ]; then zip -qr "$NAME.zip" "$NAME"; else tar -czf "$NAME.tar.gz" "$NAME"; fi )
          done
          ( cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt )
          ls -l dist
      - name: Stage the darwin binaries for the macOS packaging job (I-M1, C8)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p darwin-bins
          # The macOS job lipos EXACTLY these binaries (never recompiles), so
          # "no separate build path" is literally true (I-M1).
          cp "dist/open-seavault-rclone_${VERSION}_darwin_amd64/seavault" darwin-bins/seavault-darwin-amd64
          cp "dist/open-seavault-rclone_${VERSION}_darwin_arm64/seavault" darwin-bins/seavault-darwin-arm64
      - name: Upload the darwin binaries as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: darwin-bins/
          retention-days: 1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes

  macos:
    # The macOS packaging job (design §4): download the darwin binaries the linux
    # job produced, lipo them into a universal .app, sign (ad-hoc, or Developer ID
    # + notarize when the secrets exist), verify and smoke-test, build the DMG and
    # PKG, and attach them to the release the first job created. It needs the first
    # job so it never runs against binaries that job did not produce (I-M1).
    needs: release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: darwin-binaries
          path: darwin-bins

      - name: Assert the per-tag Gatekeeper sign-off exists (design §6, C2)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # C2: a headless runner cannot exercise the GUI Gatekeeper dialog, so the
          # per-release workaround check is a MANUAL, dated human sign-off. The job
          # only asserts a row for this tag is present; the human wrote it.
          if ! grep -qF "$TAG" packaging/macos/GATEKEEPER-CHECK.md; then
            echo "No Gatekeeper sign-off row for $TAG in packaging/macos/GATEKEEPER-CHECK.md (design §6, C2)." >&2
            echo "A human must verify the FIRST-LAUNCH workaround on the shipping macOS and add a dated row before tagging." >&2
            exit 1
          fi

      - name: Assemble, sign, verify, and package
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_INSTALLER_ID_P12: ${{ secrets.MACOS_INSTALLER_ID_P12 }}
          MACOS_INSTALLER_ID_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          APP="out/open-seavault-rclone.app"
          DMG="out/open-seavault-rclone_${VERSION}_macos_universal.dmg"
          PKG="out/open-seavault-rclone_${VERSION}_macos_universal.pkg"
          mkdir -p out

          have_devid=0
          if [ -n "${MACOS_DEVELOPER_ID_P12:-}" ] && [ -n "${APPLE_NOTARY_KEY_P8:-}" ] \
             && [ -n "${APPLE_NOTARY_KEY_ID:-}" ] && [ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]; then
            have_devid=1
          fi

          if [ "$have_devid" = "1" ]; then
            # ---- Developer ID + notarization path -----------------------------
            # Import the certificate into a throwaway keychain. The keychain
            # password is generated here and masked; no secret is ever echoed (I-M2).
            KPW="$(openssl rand -hex 24)"
            echo "::add-mask::$KPW"
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p "$KPW" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "$KPW" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            printf '%s' "$MACOS_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
            security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
            if [ -n "${MACOS_INSTALLER_ID_P12:-}" ]; then
              printf '%s' "$MACOS_INSTALLER_ID_P12" | base64 --decode > "$RUNNER_TEMP/installerid.p12"
              security import "$RUNNER_TEMP/installerid.p12" -k "$KEYCHAIN" -P "${MACOS_INSTALLER_ID_P12_PASSWORD:-}" -T /usr/bin/productsign
            fi
            security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KEYCHAIN" >/dev/null
            APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
            [ -n "$APP_IDENTITY" ] || { echo "no Developer ID Application identity in the keychain" >&2; exit 1; }
            TEAM_ID="$(printf '%s' "$APP_IDENTITY" | sed -n 's/.*(\([A-Z0-9]\{10\}\)).*/\1/p')"
            SIGNING_TEXT="Developer ID ${TEAM_ID:-unknown}, notarized $(date -u +%Y-%m-%d)"

            SIGNING_TEXT="$SIGNING_TEXT" \
              bash packaging/macos/build-bundle.sh \
                darwin-bins/seavault-darwin-amd64 darwin-bins/seavault-darwin-arm64 "$VERSION" out

            codesign --force --deep --options runtime --timestamp \
              --keychain "$KEYCHAIN" -s "$APP_IDENTITY" "$APP"

            # Notarize (design §4, C6): bounded and observable.
            printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            notarize() {
              local target="$1" tries=0 subid result out_json rc
              while :; do
                tries=$((tries+1))
                set +e
                out_json="$(xcrun notarytool submit "$target" \
                  --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" \
                  --issuer "$APPLE_NOTARY_ISSUER_ID" --output-format json --wait 2>&1)"
                rc=$?
                set -e
                subid="$(printf '%s' "$out_json" | /usr/bin/python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)"
                result="$(printf '%s' "$out_json" | /usr/bin/python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
                if [ "$result" = "Accepted" ]; then
                  return 0
                fi
                # On any non-Accepted result, fetch, print, and upload the log.
                if [ -n "$subid" ]; then
                  xcrun notarytool log "$subid" \
                    --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" \
                    --issuer "$APPLE_NOTARY_ISSUER_ID" "out/notary-log-$subid.json" || true
                  echo "---- notarytool log ($subid) ----"; cat "out/notary-log-$subid.json" || true; echo "---- end log ----"
                fi
                if [ "$result" = "Invalid" ] || [ "$result" = "Rejected" ]; then
                  echo "notarization REJECTED for $target; failing fast (C6)" >&2
                  return 1
                fi
                if [ "$tries" -ge 3 ]; then
                  echo "notarization did not reach Accepted after $tries tries (last: '$result', rc=$rc)" >&2
                  return 1
                fi
                echo "transient notarization result '$result' (rc=$rc); retrying with backoff..." >&2
                sleep $((tries*20))
              done
            }

            ( cd out && ditto -c -k --keepParent "open-seavault-rclone.app" "app.zip" )
            notarize "out/app.zip"
            xcrun stapler staple "$APP"

            bash packaging/macos/build-dmg.sh "$APP" "$VERSION" "$DMG"
            bash packaging/macos/build-pkg.sh "$APP" "$VERSION" "$PKG"

            # Sign the installer package with the Developer ID Installer cert if present.
            if [ -n "${MACOS_INSTALLER_ID_P12:-}" ]; then
              INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | awk -F'"' '/Developer ID Installer/ {print $2; exit}')"
              if [ -n "$INSTALLER_IDENTITY" ]; then
                productsign --keychain "$KEYCHAIN" --sign "$INSTALLER_IDENTITY" "$PKG" "$PKG.signed"
                mv "$PKG.signed" "$PKG"
              fi
            fi
            codesign --force --keychain "$KEYCHAIN" -s "$APP_IDENTITY" "$DMG" || true
            notarize "$DMG"; xcrun stapler staple "$DMG" || true
            notarize "$PKG"; xcrun stapler staple "$PKG" || true

            APP="$APP" DMG="$DMG" PKG="$PKG" MODE=release EXPECT_SPCTL=accept \
              SRC_AMD64=darwin-bins/seavault-darwin-amd64 SRC_ARM64=darwin-bins/seavault-darwin-arm64 \
              bash packaging/macos/verify-bundle.sh

            security delete-keychain "$KEYCHAIN" || true
            rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/installerid.p12" "$RUNNER_TEMP/notary.p8"
          else
            # ---- Ad-hoc (unsigned tier) path ----------------------------------
            SIGNING_TEXT="ad-hoc signed, not notarized" \
              bash packaging/macos/build-bundle.sh \
                darwin-bins/seavault-darwin-amd64 darwin-bins/seavault-darwin-arm64 "$VERSION" out

            # Ad-hoc sign so the universal binary is a valid signed object on Apple
            # silicon (design §4, secrets-absent path).
            codesign --force --deep -s - "$APP"

            bash packaging/macos/build-dmg.sh "$APP" "$VERSION" "$DMG"
            bash packaging/macos/build-pkg.sh "$APP" "$VERSION" "$PKG"

            APP="$APP" DMG="$DMG" PKG="$PKG" MODE=release EXPECT_SPCTL=reject \
              SRC_AMD64=darwin-bins/seavault-darwin-amd64 SRC_ARM64=darwin-bins/seavault-darwin-arm64 \
              bash packaging/macos/verify-bundle.sh
          fi

          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Upload the DMG and PKG and append their hashes to SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" "$DMG" "$PKG" --clobber
          # Append the DMG/PKG hashes to the release's SHA256SUMS.txt.
          gh release download "$TAG" -p SHA256SUMS.txt -D sums || true
          [ -f sums/SHA256SUMS.txt ] || { mkdir -p sums; : > sums/SHA256SUMS.txt; }
          ( cd out && shasum -a 256 "$(basename "$DMG")" "$(basename "$PKG")" ) >> sums/SHA256SUMS.txt
          gh release upload "$TAG" sums/SHA256SUMS.txt --clobber

      - name: Prepend the first-launch note to the Release body (C3, M9)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          body="$(gh release view "$TAG" --json body -q .body || echo '')"
          {
            cat packaging/macos/FIRST-LAUNCH.txt
            echo
            echo '---'
            echo
            printf '%s\n' "$body"
          } > note-body.md
          gh release edit "$TAG" --notes-file note-body.md
          # M9: assert the published body now begins with the first-launch note.
          firstline="$(head -1 packaging/macos/FIRST-LAUNCH.txt)"
          newbody="$(gh release view "$TAG" --json body -q .body)"
          case "$newbody" in
            "$firstline"*) echo "M9 ok: release body begins with the first-launch note" ;;
            *) echo "M9 FAIL: release body does not begin with the first-launch note" >&2; exit 1 ;;
          esac
